publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  nsd: ^5.0.1
  crypto: ^3.0.7
  xterm: ^4.0.0
  pdfx: ^2.11.0
  markdown_widget: ^2.3.2+8
  markdown: ^7.3.1
  scroll_to_index: ^3.0.1
  lucide_icons_flutter: ^3.1.20
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  open_filex: ^4.7.0
  speech_to_text: ^7.5.0
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  battery_plus: ^7.1.1
  receive_sharing_intent: ^1.9.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  flutter_localizations:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  fast_gbk: ^1.0.0
  xml: ^7.0.1
  archive: ^4.3.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.3
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
